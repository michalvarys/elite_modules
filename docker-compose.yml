# Odoo 18 pro moduly z tohoto repozitare.
#
# Cely repozitar je namountovany do /mnt/modules. Moduly jsou v nem po
# projektech: elite.vet/ jsou moduly kliniky Elite Vet. Dalsi projekt = dalsi
# slozka vedle a jeden radek navic v addons_path v config/odoo.conf.

services:
  odoo:
    # odoo:18 + Python balicky pro mcp_server (viz Dockerfile.dev)
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: odoo-elite:18
    container_name: odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./:/mnt/modules:ro
      - ./config:/etc/odoo:ro
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    restart: unless-stopped

  # JEN LOKALNI VYVOJ: MCP endpoint pro AI agenty na http://localhost:8070/mcp.
  # MCP klient neposila session cookie, takze Odoo s vice databazemi nevi, kterou
  # pouzit; tahle instance vidi jen ev_test. Na serveru s jedinou databazi neni
  # potreba, /mcp bezi primo v hlavni instanci.
  # Spousti se jen s profilem mcp (COMPOSE_PROFILES=mcp v neverzovanem .env).
  # Konfigurace i hesla jsou stejne jako u hlavni instance (config/odoo.conf).
  odoo-mcp:
    profiles: ["mcp"]
    image: odoo-elite:18
    container_name: odoo-mcp
    command: ["odoo", "--database=ev_test", "--db-filter=^ev_test$$", "--no-database-list", "--max-cron-threads=0"]
    depends_on:
      - db
      - odoo
    ports:
      - "8070:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./:/mnt/modules:ro
      - ./config:/etc/odoo:ro
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Jen pro vývoj: zachytí všechny e-maily z Odoo a ukáže je na http://localhost:8025.
  # Nic neposílá dál. V lokální databázi je k němu odchozí server „Mailpit (vývoj)“.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: odoo-mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  odoo-data:
  db-data:
