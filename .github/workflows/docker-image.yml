# Build Odoo image with the Elite modules on top of varyshop/website and push it to GHCR.
#
#   push to master   -> :master, :sha-<short>, :latest
#   tag v1.2.3       -> :1.2.3, :1.2, :sha-<short>
#   pull request     -> build + smoke test only, nothing is pushed
name: Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  BASE_IMAGE: varyshop/website:release-1.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          load: true
          tags: elite-modules:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh elite-modules:ci -c '
            set -e
            python3 -c "import authlib, defusedxml, packaging; print(\"authlib\", authlib.__version__)"
            odoo --version
            for m in elite_common/elite_eet elite_vet/elite_vet_web elite_arena/elite_arena_pos elite_trafika/elite_trafika_pos elite_restaurace/elite_imi_pos; do
              test -f /mnt/modules/$m/__manifest__.py || { echo "missing $m"; exit 1; }
            done
            test ! -e /mnt/modules/elite_common/mcp_server || { echo "mcp_server must not be in the image"; exit 1; }
          '

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
