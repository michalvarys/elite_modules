[options]
; Vychozi konfigurace image z Dockerfile (zaklad varyshop/website, Odoo v /app).
; Na serveru ji prekryjte vlastnim /etc/odoo/odoo.conf.
; Lokalni vyvoj pouziva config/odoo.conf.
addons_path = /mnt/modules/elite_common,/mnt/modules/elite_vet,/mnt/modules/elite_arena,/mnt/modules/elite_trafika,/app/addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; heslo pro spravu databazi, zmente pred nasazenim
admin_passwd = zmente-me
