[options]
; Druha instance Odoo jen pro MCP endpoint (http://localhost:8070/mcp).
; MCP klient neposila session cookie, takze Odoo musi databazi poznat samo:
; tahle instance vidi jen ev_test. Hlavni instance na 8069 zustava beze zmeny.
addons_path = /mnt/modules/elite_common,/mnt/modules/elite_vet,/mnt/modules/elite_arena,/mnt/modules/elite_trafika,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
admin_passwd = zmente-me
db_name = ev_test
dbfilter = ^ev_test$
list_db = False
; crony uz bezi v hlavni instanci
max_cron_threads = 0
