    <circle cx="16" cy="60" r="5" fill="#5ba8a0" fill-opacity="0.2"/>
    <text x="16" y="62" font-family="Arial,sans-serif" font-size="5" font-weight="700" fill="#5ba8a0" text-anchor="middle">A</text>
    <rect x="24" y="57" width="20" height="2" fill="#fff"/>
    <rect x="24" y="61" width="16" height="1.5" fill="#5ba8a0" fill-opacity="0.5"/>
