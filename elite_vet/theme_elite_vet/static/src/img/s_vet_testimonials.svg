  <!-- Google rating pill -->
  <rect x="70" y="100" width="60" height="10" rx="5" fill="#5ba8a0" fill-opacity="0.15"/>
  <rect x="78" y="103" width="44" height="4" rx="1" fill="#5ba8a0" fill-opacity="0.5"/>
