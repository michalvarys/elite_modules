<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <rect width="200" height="120" fill="#1a2744"/>
  <!-- Section header -->
  <rect x="60" y="6" width="26" height="2.5" rx="0.5" fill="#5ba8a0"/>
  <rect x="40" y="11" width="120" height="5" rx="1" fill="#fff"/>
  <!-- 4 testimonial cards -->
  <g>
    <rect x="6" y="24" width="44" height="68" rx="3" fill="#fff" fill-opacity="0.06" stroke="#5ba8a0" stroke-width="0.3" stroke-opacity="0.3"/>
    <!-- Stars -->
    <g fill="#5ba8a0">
      <circle cx="14" cy="30" r="1.5"/><circle cx="20" cy="30" r="1.5"/><circle cx="26" cy="30" r="1.5"/><circle cx="32" cy="30" r="1.5"/><circle cx="38" cy="30" r="1.5"/>
    </g>
    <rect x="10" y="36" width="36" height="1.5" fill="#fff" fill-opacity="0.6"/>
