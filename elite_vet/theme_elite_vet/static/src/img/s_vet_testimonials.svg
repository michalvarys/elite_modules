  <g>
    <rect x="150" y="24" width="44" height="68" rx="3" fill="#fff" fill-opacity="0.06" stroke="#5ba8a0" stroke-width="0.3" stroke-opacity="0.3"/>
    <g fill="#5ba8a0">
      <circle cx="158" cy="30" r="1.5"/><circle cx="164" cy="30" r="1.5"/><circle cx="170" cy="30" r="1.5"/><circle cx="176" cy="30" r="1.5"/><circle cx="182" cy="30" r="1.5"/>
