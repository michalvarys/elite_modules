<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <rect width="200" height="120" fill="#1a2744"/>
  <!-- Section header -->
  <rect x="60" y="6" width="26" height="2.5" rx="0.5" fill="#5ba8a0"/>
  <rect x="45" y="11" width="110" height="5" rx="1" fill="#fff"/>
  <!-- 3 columns -->
  <!-- Left: info cards -->
  <g>
    <rect x="6" y="24" width="58" height="16" rx="2" fill="#fff" fill-opacity="0.06" stroke="#5ba8a0" stroke-width="0.3" stroke-opacity="0.3"/>
    <circle cx="16" cy="32" r="4" fill="#5ba8a0" fill-opacity="0.2"/>
    <path d="M14 32 L16 30 L18 32 L16 34Z" fill="#5ba8a0" fill-opacity="0.5"/>
    <rect x="24" y="29" width="30" height="2" fill="#fff"/>
    <rect x="24" y="33" width="36" height="1.5" fill="#fff" fill-opacity="0.4"/>

    <rect x="6" y="44" width="58" height="16" rx="2" fill="#fff" fill-opacity="0.06" stroke="#5ba8a0" stroke-width="0.3" stroke-opacity="0.3"/>
    <circle cx="16" cy="52" r="4" fill="#5ba8a0" fill-opacity="0.2"/>
    <rect x="13" y="51" width="6" height="2" rx="1" fill="#5ba8a0" fill-opacity="0.5"/>
    <rect x="24" y="49" width="30" height="2" fill="#fff"/>
    <rect x="24" y="53" width="34" height="1.5" fill="#fff" fill-opacity="0.4"/>

    <rect x="6" y="64" width="58" height="16" rx="2" fill="#fff" fill-opacity="0.06" stroke="#5ba8a0" stroke-width="0.3" stroke-opacity="0.3"/>
    <circle cx="16" cy="72" r="4" fill="#5ba8a0" fill-opacity="0.2"/>
    <rect x="13" y="70" width="6" height="4" rx="0.5" fill="#5ba8a0" fill-opacity="0.5"/>
    <rect x="24" y="69" width="30" height="2" fill="#fff"/>
    <rect x="24" y="73" width="36" height="1.5" fill="#fff" fill-opacity="0.4"/>
  </g>
  <!-- Center: hours table -->
  <g>
    <rect x="70" y="24" width="58" height="56" rx="2" fill="#fff" fill-opacity="0.04"/>
    <rect x="76" y="28" width="30" height="3" fill="#fff"/>
    <!-- Table rows -->
    <line x1="74" y1="35" x2="124" y2="35" stroke="#5ba8a0" stroke-width="0.2" stroke-opacity="0.3"/>
    <rect x="76" y="38" width="16" height="1.5" fill="#fff" fill-opacity="0.5"/>
    <rect x="104" y="38" width="18" height="1.5" fill="#5ba8a0"/>
    <line x1="74" y1="43" x2="124" y2="43" stroke="#5ba8a0" stroke-width="0.2" stroke-opacity="0.3"/>
    <rect x="76" y="46" width="16" height="1.5" fill="#fff" fill-opacity="0.5"/>
    <rect x="104" y="46" width="18" height="1.5" fill="#5ba8a0"/>
    <line x1="74" y1="51" x2="124" y2="51" stroke="#5ba8a0" stroke-width="0.2" stroke-opacity="0.3"/>
    <rect x="76" y="54" width="16" height="1.5" fill="#fff" fill-opacity="0.5"/>
    <rect x="104" y="54" width="18" height="1.5" fill="#fff" fill-opacity="0.3"/>
    <line x1="74" y1="59" x2="124" y2="59" stroke="#5ba8a0" stroke-width="0.2" stroke-opacity="0.3"/>
    <rect x="76" y="62" width="16" height="1.5" fill="#fff" fill-opacity="0.5"/>
    <rect x="104" y="62" width="18" height="1.5" fill="#fff" fill-opacity="0.3"/>
  </g>
  <!-- Right: map -->
  <g>
    <rect x="134" y="24" width="60" height="56" rx="2" fill="#5ba8a0" fill-opacity="0.08" stroke="#5ba8a0" stroke-width="0.3" stroke-opacity="0.3"/>
    <!-- Grid lines -->
    <line x1="148" y1="24" x2="148" y2="80" stroke="#5ba8a0" stroke-width="0.15" stroke-opacity="0.2"/>
    <line x1="164" y1="24" x2="164" y2="80" stroke="#5ba8a0" stroke-width="0.15" stroke-opacity="0.2"/>
    <line x1="180" y1="24" x2="180" y2="80" stroke="#5ba8a0" stroke-width="0.15" stroke-opacity="0.2"/>
    <line x1="134" y1="40" x2="194" y2="40" stroke="#5ba8a0" stroke-width="0.15" stroke-opacity="0.2"/>
    <line x1="134" y1="56" x2="194" y2="56" stroke="#5ba8a0" stroke-width="0.15" stroke-opacity="0.2"/>
    <!-- Pin -->
    <circle cx="164" cy="48" r="4" fill="#5ba8a0" fill-opacity="0.3"/>
    <circle cx="164" cy="48" r="2" fill="#5ba8a0"/>
    <path d="M164 52 L164 56" stroke="#5ba8a0" stroke-width="0.8"/>
  </g>
  <!-- Address bar -->
  <rect x="6" y="88" width="188" height="22" rx="3" fill="#fff" fill-opacity="0.04"/>
  <circle cx="18" cy="99" r="4" fill="#5ba8a0" fill-opacity="0.15"/>
  <path d="M16 99 L18 97 L20 99 L18 101Z" fill="#5ba8a0" fill-opacity="0.5"/>
  <rect x="26" y="96" width="60" height="2" fill="#fff"/>
  <rect x="26" y="100" width="80" height="1.5" fill="#fff" fill-opacity="0.4"/>
</svg>
