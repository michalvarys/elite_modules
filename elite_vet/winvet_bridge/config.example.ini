; WinVet bridge configuration (copy to config.ini and edit).
; Relative paths are resolved against the directory of this file.
; Point the bridge to it with --config config.ini or the env variable WINVET_BRIDGE_CONFIG.

[firebird]
; Firebird DSN "host/port:path" (Windows example: localhost/3050:C:\WinVet\Data\WINVET.FDB)
dsn = localhost/3050:C:\WinVet\Data\WINVET.FDB
user = SYSDBA
; Either the password itself ...
password =
; ... or the NAME of an environment variable holding it (takes precedence when set)
password_env = WINVET_FB_PASSWORD
; fbclient library; empty = let firebird-driver find it (PATH / registry).
; Windows: C:\Program Files\Firebird\Firebird_3_0\fbclient.dll   Linux: /usr/lib/libfbclient.so.2
fb_client_library =

[odoo]
url = https://www.example-vet.cz
; API key generated in Odoo (settings of the module elite_vet_winvet), or the env variable name
api_key =
api_key_env = WINVET_ODOO_API_KEY
; seconds per HTTP request, number of retries on network errors / HTTP 5xx
timeout = 60
retries = 3

[bridge]
; live = the WinVet production database, backup = a restored backup copy (only reported to Odoo)
source = live
state_file = winvet_bridge_state.json
; verified WinVet versions; default = verified.json next to the package
verified_file =
; records per push batch (contract maximum 500)
batch_size = 500
; service mode: incremental run every N minutes, full run once a day at HH:MM (local time)
interval_minutes = 15
full_sync_time = 03:00
log_file = logs/winvet_bridge.log
log_level = INFO
; contract v4 - WinVet calendar: window read on every run = today - days_back .. today + days_ahead
calendar_days_back = 1
calendar_days_ahead = 60
; service mode: an extra calendar-only run every N minutes (0 = calendar only with the normal run)
calendar_interval_minutes = 5
