[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "winvet_bridge"
version = "5.0.1"
description = "Read-only bridge from the WinVet veterinary database (Firebird) to Odoo"
requires-python = ">=3.10"
dependencies = ["firebird-driver>=1.10,<2"]

[project.scripts]
winvet-bridge = "winvet_bridge.cli:main"

[tool.setuptools]
packages = ["winvet_bridge"]
