[firebird]
; Worker replaces the DSN with the path of the newly restored snapshot.
dsn = localhost/3051:/work/placeholder.fdb
user = SYSDBA
password_env = WINVET_FB_PASSWORD
fb_client_library = /usr/lib/x86_64-linux-gnu/libfbclient.so.2

[odoo]
url = https://REPLACE_WITH_ODOO_HOST
api_key_env = WINVET_ODOO_API_KEY
timeout = 120
retries = 3

[bridge]
source = backup
state_file = /srv/winvet/state/unused-bridge-state.json
verified_file = /opt/winvet-import/verified.json
schema_baseline_file = /opt/winvet-import/schema_baseline.json
batch_size = 250
log_level = WARNING
