[import]
inbox = /srv/sftp/winvet/incoming
work = /srv/winvet/work
state = /srv/winvet/state
container = winvet-import-fb
dsn_prefix = localhost/3051:
bridge_config = /etc/winvet-import/bridge.ini
max_age_hours = 36
stale_hours = 30
retry_seconds = 900
max_zip_bytes = 1073741824
max_fbk_bytes = 4294967296
; Strict preflight: each listed entity must have at least this many rows.
; Adjust to the clinic, NOT to an accidentally empty/corrupt backup.
minimum_counts = {"users":1,"items":1,"owners":1,"contacts":1,"patients":1,"vaccinations":1,"visits":1,"vitals":1,"sale_documents":1,"sale_lines":1,"payments":1,"bundles":1,"bundle_lines":1,"phrases":1}
; Stop if any entity lost more than 20 percent vs the previous successful snapshot.
minimum_ratio = 0.80
; Stable reference row, no secret fields. The reference must not change day to day.
; Better: replace with an explicit ID of a long-lived reference record after initial inspection.
identity_sql = SELECT FIRST 1 ID_PARTNER, PARTNER_NAZEV, ZALOZENI_ZAZNAMU FROM PARTNER WHERE ID_PARTNER > 0 ORDER BY ID_PARTNER
; Run --inspect on a trusted fresh backup, then paste the printed SHA256 here.
identity_sha256 = REPLACE_WITH_TRUSTED_INSPECT_HASH
