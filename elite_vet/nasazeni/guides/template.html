<title>Návody Elite Vet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a handbook. Role index at home; a guide is a reading column with a contents rail beside it. */
:root {
  --bg: #f4f7f6; --paper: #ffffff; --ink: #12211f; --muted: #566966; --line: #d9e3e1;
  --accent: #2b7870; --accent-soft: #e2f0ed; --on-accent: #ffffff; --chip: #eef3f2;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1716; --paper: #16211f; --ink: #e4eeec; --muted: #9bb0ac; --line: #2a3a37;
  --accent: #5fb9ad; --accent-soft: #1d3330; --on-accent: #0f1716; --chip: #1f2d2b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1716; --paper: #16211f; --ink: #e4eeec; --muted: #9bb0ac; --line: #2a3a37;
  --accent: #5fb9ad; --accent-soft: #1d3330; --on-accent: #0f1716; --chip: #1f2d2b; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; color: var(--ink); text-decoration: none; white-space: nowrap; }
.search { flex: 1 1 220px; min-width: 0; position: relative; }
.search input { width: 100%; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
  max-height: 60vh; overflow: auto; box-shadow: 0 8px 24px rgba(18,33,31,.14); }
.results a { display: block; padding: 8px 12px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); }
.results a:last-child { border-bottom: 0; }
.results a:hover, .results a:focus { background: var(--accent-soft); }
.results small { display: block; color: var(--muted); }
.results p { margin: 0; padding: 8px 12px; color: var(--muted); }
.langs { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.langs button { font: inherit; font-size: 14px; font-weight: 700; border: 0; padding: 5px 12px; background: transparent; color: var(--muted); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.page { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; }

.home h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); margin: 0 0 8px; }
.home .lede { max-width: 62ch; color: var(--muted); margin: 0 0 28px; font-size: 1.08rem; }
.roles { display: grid; gap: 28px; }
.role h2 { font-size: .8rem; font-family: var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.card { display: block; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; text-decoration: none; color: var(--ink); }
.card:hover { border-color: var(--accent); }
.card b { display: block; font-family: var(--f-display); font-size: 1.12rem; }
.card span { color: var(--muted); font-size: 15px; }
.note { margin-top: 28px; max-width: 70ch; color: var(--muted); font-size: 15px; }

.reader { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100vh - 96px); overflow: auto; font-size: 14.5px; }
.rail .back { display: block; margin-bottom: 10px; text-decoration: none; font-weight: 700; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rail a { display: block; padding: 3px 8px; border-radius: 4px; text-decoration: none; color: var(--ink); line-height: 1.3; }
.rail a:hover { background: var(--accent-soft); }
.rail li.l3 a { padding-left: 20px; color: var(--muted); font-size: 13.5px; }
.rail details > summary { display: none; }
.guide { max-width: 74ch; min-width: 0; }
.guide h1 { font-size: clamp(1.8rem, 3.6vw, 2.4rem); margin: 0 0 16px; }
.guide h2 { font-size: 1.45rem; margin: 2.2em 0 .5em; padding-top: .5em; border-top: 1px solid var(--line); scroll-margin-top: 80px; }
.guide h3 { font-size: 1.12rem; margin: 1.6em 0 .4em; scroll-margin-top: 80px; }
.guide h4 { font-size: 1rem; margin: 1.3em 0 .3em; }
.guide p, .guide ul, .guide ol { margin: 0 0 .85em; }
.guide li { margin-bottom: .25em; }
.guide li.check { list-style: "☐  "; }
.guide li.check.done { list-style: "☑  "; }
.guide hr { display: none; }
.guide code { font-family: var(--f-mono); font-size: .88em; background: var(--chip); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
.guide pre { background: var(--chip); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
.guide pre code { background: none; padding: 0; overflow-wrap: normal; }
.guide blockquote { margin: 0 0 .85em; padding: 8px 14px; background: var(--accent-soft); border-radius: 6px; }
.guide blockquote p:last-child { margin: 0; }
.guide figure { margin: 1em 0; }
.guide img { display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; height: auto; }
.tbl { overflow-x: auto; margin: 0 0 1em; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 7px 11px; border-bottom: 1px solid var(--line); }
th { background: var(--chip); font-size: 14px; }
tr:last-child td { border-bottom: 0; }
@media (max-width: 900px) {
  .reader { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .rail { position: static; max-height: none; }
  .rail details > summary { display: block; cursor: pointer; font-weight: 700; padding: 4px 0; }
}
</style>

<header class="top"><div class="top-in">
  <a class="brand" id="brand" href="#cs">Návody Elite Vet</a>
  <div class="search">
    <input id="q" type="search" autocomplete="off">
    <div class="results" id="results" hidden></div>
  </div>
  <div class="langs" role="group" aria-label="Jazyk / Language">
    <button type="button" id="lang-cs" data-lang="cs">CS</button>
    <button type="button" id="lang-en" data-lang="en">EN</button>
  </div>
</div></header>

<main class="page">
  <section class="home" id="home"></section>
  <div class="reader" id="reader" hidden>
    <nav class="rail" id="rail"></nav>
    <div id="articles">
<!--__ARTICLES__-->
    </div>
  </div>
</main>

<script>
const DATA = /*__DATA__*/null;
const TEXT = {
  cs: { intro: "Vyberte si podle toho, kde pracujete. Názvy tlačítek v návodech odpovídají tomu, co vidíte v Odoo.",
        back: "‹ Všechny návody", toc: "Obsah návodu", search: "Hledat v návodech…", none: "Nic jsme nenašli.",
        note: "Obrázky ukazují ukázková data. Některé jsou starší než aktuální obrazovky, rozdíl je u nich uvedený; platí text návodu." },
  en: { intro: "Pick the guide for the place you work. Odoo screens are in Czech, so button names stay in Czech with the English meaning in brackets.",
        back: "‹ All guides", toc: "In this guide", search: "Search the guides…", none: "Nothing found.",
        note: "Screenshots show the Czech screens with sample data. Some are older than the current screens; the difference is noted under them, and the text of the guide is what applies." },
};
const $ = (id) => document.getElementById(id);
let lang = "cs";
try { if (localStorage.getItem("guides-lang") === "en") lang = "en"; } catch (e) { /* storage unavailable */ }

function parseHash() {
  const m = /^#(cs|en)(?:-(.+?))?(?:--(.+))?$/.exec(location.hash);
  if (!m) return { lang, guide: null, anchor: null };
  return { lang: m[1], guide: m[2] || null, anchor: m[3] ? location.hash.slice(1) : null };
}
function renderHome() {
  const t = TEXT[lang];
  const roles = DATA.roles.map((r) => {
    const cards = DATA.guides.filter((g) => g.role === r.key && g.toc[lang]).map((g) =>
      `<a class="card" href="#${lang}-${g.key}"><b>${g.title[lang]}</b><span>${g.desc[lang]}</span></a>`).join("");
    return cards ? `<section class="role"><h2>${r[lang]}</h2><div class="cards">${cards}</div></section>` : "";
  }).join("");
  $("home").innerHTML = `<h1>${lang === "cs" ? "Návody Elite Vet" : "Elite Vet guides"}</h1><p class="lede">${t.intro}</p>
    <div class="roles">${roles}</div><p class="note">${t.note}</p>`;
}
function renderRail(g) {
  const t = TEXT[lang];
  const items = (g.toc[lang] || []).map((h) => `<li class="l${h.level}"><a href="#${h.id}">${h.text.replace(/</g, "&lt;")}</a></li>`).join("");
  $("rail").innerHTML = `<a class="back" href="#${lang}">${t.back}</a>
    <details id="toc-box" open><summary>${t.toc}</summary><ol>${items}</ol></details>`;
  if (window.matchMedia("(max-width: 900px)").matches) $("toc-box").open = false;
}
function show() {
  const route = parseHash();
  lang = route.lang;
  try { localStorage.setItem("guides-lang", lang); } catch (e) { /* storage unavailable */ }
  document.documentElement.lang = lang;
  for (const l of ["cs", "en"]) $("lang-" + l).setAttribute("aria-pressed", String(l === lang));
  $("brand").textContent = lang === "cs" ? "Návody Elite Vet" : "Elite Vet guides";
  $("brand").href = "#" + lang;
  $("q").placeholder = TEXT[lang].search;
  document.querySelectorAll(".guide").forEach((a) => { a.hidden = true; });
  const g = DATA.guides.find((x) => x.key === route.guide);
  const article = g && $(`g-${lang}-${g.key}`);
  $("home").hidden = !!article;
  $("reader").hidden = !article;
  if (!article) { renderHome(); window.scrollTo(0, 0); return; }
  article.hidden = false;
  renderRail(g);
  const target = route.anchor && document.getElementById(route.anchor);
  if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
}
function setLang(next) {
  const route = parseHash();
  lang = next;
  location.hash = route.guide ? `#${next}-${route.guide}` : `#${next}`;
}
document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));

function search(term) {
  const box = $("results");
  const q = term.trim().toLowerCase();
  if (q.length < 2) { box.hidden = true; return; }
  const hits = [];
  for (const g of DATA.guides) {
    const article = $(`g-${lang}-${g.key}`);
    if (!article) continue;
    let heading = null;
    for (const el of article.children) {
      if (/^H[23]$/.test(el.tagName)) heading = el;
      if (el.textContent.toLowerCase().includes(q) && el.tagName !== "H1") {
        const id = heading ? heading.id : null;
        if (!hits.some((h) => h.id === id && h.g === g)) hits.push({ g, id, label: heading ? heading.textContent : g.title[lang] });
      }
    }
  }
  box.innerHTML = hits.length ? hits.slice(0, 30).map((h) =>
    `<a href="#${h.id || lang + "-" + h.g.key}">${h.label.replace(/</g, "&lt;")}<small>${h.g.title[lang]}</small></a>`).join("")
    : `<p>${TEXT[lang].none}</p>`;
  box.hidden = false;
}
$("q").addEventListener("input", (e) => search(e.target.value));
$("results").addEventListener("click", () => { $("results").hidden = true; $("q").value = ""; });
window.addEventListener("hashchange", show);
show();
</script>
